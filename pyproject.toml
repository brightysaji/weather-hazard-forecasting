[project]
name = "weather-intelligence-api"
version = "1.0.0"
description = "FastAPI service exposing Climate Comfort Index and Weather Hazard Category predictions for Sydney, NSW."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pandas==2.2.3",
    "numpy==2.5.3",
    "xgboost==3.4.1",
    "joblib==1.6.0",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
]

[tool.uv]
package = false